<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#grad1)" rx="20" ry="20"/>
  
  <!-- Border -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#ff6b35" stroke-width="3" rx="15" ry="15"/>
  
  <!-- Icon -->
  <g transform="translate(200, 150)">
    <!-- Camera/Image icon -->
    <rect x="-30" y="-20" width="60" height="40" fill="none" stroke="#ff6b35" stroke-width="3" rx="5"/>
    <circle cx="0" cy="-10" r="8" fill="none" stroke="#ff6b35" stroke-width="3"/>
    <rect x="-25" y="-15" width="50" height="30" fill="none" stroke="#ff6b35" stroke-width="2" rx="3"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#ff6b35" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#ff6b35">
    Generate Image
  </text>
  
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#888">
    Click to create character image
  </text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="3" fill="#ff6b35" opacity="0.6"/>
  <circle cx="350" cy="80" r="2" fill="#ff6b35" opacity="0.4"/>
  <circle cx="80" cy="350" r="2" fill="#ff6b35" opacity="0.4"/>
  <circle cx="320" cy="320" r="3" fill="#ff6b35" opacity="0.6"/>
</svg> 